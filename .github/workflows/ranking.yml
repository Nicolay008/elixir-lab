name: Ingesta (partidas y ranking)

on:
  schedule:
    - cron: "23 * * * *"   # cada hora, en el minuto 23 (evita la congestión de las horas en punto)
  workflow_dispatch:

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests "psycopg[binary]" python-dotenv
      - name: Partidas
        run: python src/ingest.py
        env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Ranking Perú y global
        run: python src/ingest_ranking.py
        env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # al lanzarlo a mano, la foto se guarda siempre
          FORZAR_FOTO: ${{ github.event_name == 'workflow_dispatch' }}
