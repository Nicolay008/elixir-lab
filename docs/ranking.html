<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranking de Senda de Leyendas · Elixir Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/jugador.css?v=8">
<link rel="stylesheet" href="css/ranking.css?v=16">
</head>
<body>
<main>  
  <header class="cabecera">
    <div class="arriba">
    <a class="brand" href="./" aria-label="Volver a Elixir Lab"><svg class="logo" viewBox="-34 -56 68 100" aria-hidden="true"><defs><linearGradient id="lgR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--elixir-2)"/><stop offset="1" style="stop-color:var(--elixir)"/></linearGradient></defs><path d="M-9 -26 L-9 -6 L-30 34 C-32 39 -29 42 -24 42 L24 42 C29 42 32 39 30 34 L9 -6 L9 -26 Z" fill="none" style="stroke:var(--elixir)" stroke-width="4" stroke-linejoin="round"/><path d="M-20 18 L20 18 L28 35 C29 38 27 40 24 40 L-24 40 C-27 40 -29 38 -28 35 Z" fill="url(#lgR)"/><rect x="-14" y="-32" width="28" height="7" rx="2" style="fill:var(--elixir)"/><path d="M0 -54 C4 -48 7 -44 7 -40 C7 -36 4 -34 0 -34 C-4 -34 -7 -36 -7 -40 C-7 -44 -4 -48 0 -54 Z" fill="url(#lgR)"/></svg>Elixir Lab</a>
    <button id="idioma" class="idioma" type="button" aria-label="Change language to English" data-en-label="Cambiar el idioma a español">EN</button>
    </div>
    <h1 data-en="Senda de Leyendas ranking">Ranking de Senda de Leyendas</h1>
    <p class="intro" data-en="Top players in Peru and worldwide, with their current decks. Tap a deck to copy it into the game.">Top de jugadores en Perú y en el mundo, con los mazos que usan ahora. Pulsa un mazo para copiarlo al juego.</p>
    <div class="pulsador pestanas" role="tablist" aria-label="Ámbito" data-en-label="Scope">
      <button type="button" role="tab" data-ambito="global" aria-pressed="true" aria-selected="true" data-en="Global">Global</button>
      <button type="button" role="tab" data-ambito="pe" aria-pressed="false" aria-selected="false" data-en="Perú">Perú</button>
    </div>
    <p id="foto" class="foto"></p>
  </header>

  <section id="ranking">
  <div class="tabla-envoltorio">
    <div class="ranking-cabecera">
      <span data-en="Pos.">Puesto</span>
      <span data-en="Move">Mov.</span>
      <span data-en="Player">Jugador</span>
      <span>Rating</span>
      <span data-en="Clan">Clan</span>
    </div>
    <div id="tabla-ranking"></div>
  </div>
</section>

</main>
<script src="js/ranking.js?v=10" type="module"></script>
<script src="js/i18n.js?v=10" type="module"></script>
<script type="module">
  import { aplicar, alternar } from './js/i18n.js?v=8';
  aplicar();
  document.getElementById('idioma').addEventListener('click', alternar);
</script>
</body>
</html>
